trigger: none
pr: none

pool:
  vmImage: windows-latest

parameters:
  - name: testFilter
    displayName: Test filter
    type: string
    default: '@example'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node.js 20

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Playwright browser

  - script: npm run lint
    displayName: Lint framework

  - script: npx tsc --noEmit
    displayName: Type-check framework

  - script: npx playwright test --grep "${{ parameters.testFilter }}"
    displayName: Run selected tests
    env:
      CI: 'true'
      # Must match testFilter: playwright.config.ts forces workers=1 for '@example' so
      # UI logins don't collide on the shared public-demo account.
      TAGS: '${{ parameters.testFilter }}'
      USER_PASSWORD: $(USER_PASSWORD)
      SECOND_USER_PASSWORD: $(SECOND_USER_PASSWORD)
      ADMIN_PASSWORD: $(ADMIN_PASSWORD)
      API_AUTH_TOKEN: $(API_AUTH_TOKEN)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
